    <style>
        :root {
            /* Motus Palette */
            --color-bg: #ffffff;
            --color-bg-card: #ffffff;
            --color-bg-track: #f3f6f9;
            
            --color-text-main: #1a1a1a;
            --color-text-muted: #555555;
            
            --color-accent: #1484e6;
            --color-accent-soft: #e3f2fd;
            
            --color-border: #e0e0e0;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            
            --font-ui: 'Space Mono', monospace;
            --font-math: 'Noto Sans Math', 'Cambria Math', 'Segoe UI Symbol', sans-serif;
            
            --radius-sm: 6px;
        }

        ::selection {
            background-color: var(--color-accent);
            color: var(--color-bg);
        }
        
        /* Modern Scrollbar & Stability */
        html {
            scrollbar-gutter: stable;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 5px;
            border: 2px solid var(--color-bg); /* Padding effect */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Subtle background pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--color-bg-track) 1px, transparent 1px),
                linear-gradient(90deg, var(--color-bg-track) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.5;
        }

        /* Top Navigation Bar */
        .top-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-link {
            text-decoration: none;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 700;
        }
        
        .back-link:hover { color: var(--color-accent); }

        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-text {
            border: none;
            background: none;
            color: var(--color-text-muted);
            font-family: var(--font-ui);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }
        .btn-text:hover { color: var(--color-accent); }

        /* Search Bar */
        .search-container {
            width: 100%;
            max-width: 1000px;
            position: sticky;
            top: 1rem;
            z-index: 100;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            font-family: var(--font-ui);
            font-size: 1rem;
            border: 2px solid var(--color-border);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            box-shadow: var(--shadow-soft);
            transition: all 0.2s;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 4px 12px rgba(20, 132, 230, 0.15);
        }

        /* Content Layout */
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        
        .category-wrapper {
            margin-top: 2rem;
        }
        
        .category-wrapper:first-child {
            margin-top: 0;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--color-bg-track);
            padding-bottom: 0.25rem;
        }

        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 0.35rem; /* Very compact */
        }

        .symbol-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            user-select: none;
        }

        .symbol-card:hover {
            border-color: var(--color-accent);
            background-color: var(--color-accent-soft);
            transform: scale(1.1);
            z-index: 10;
        }

        .symbol-card:active {
            transform: scale(0.95);
        }

        .symbol {
            font-family: var(--font-math);
            font-size: 1.25rem;
            line-height: 1;
        }
        
        /* Specific tweaks for tiny sub/superscripts to be readable */
        .symbol.small { font-size: 1.1rem; }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--color-text-muted);
            font-style: italic;
            display: none;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-text-main);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 600px) {
            .symbol-grid { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); }
            .symbol { font-size: 1.1rem; }
        }

        // --- App Logic ---
        const LS_KEY = 'stuff_math_symbols_v1';
        let userStats = {
            recent: [], // array of chars, max 14
            counts: {}  // char -> int
        };

        // --- Init ---
        function init() {
            loadStats();
            renderCategories(LIBRARY); // Initial render of everything
            renderStats();
            
            // Search listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                handleSearch(query);
            });

            // Clear listener
            document.getElementById('clearDataBtn').addEventListener('click', () => {
                if(confirm("Cancellare la cronologia e i simboli più usati?")) {
                    clearData();
                }
            });
        }

        function loadStats() {
            const stored = localStorage.getItem(LS_KEY);
            if (stored) {
                try {
                    userStats = JSON.parse(stored);
                } catch(e) { console.error("Bad storage", e); }
            }
        }

        function saveStats() {
            localStorage.setItem(LS_KEY, JSON.stringify(userStats));
            renderStats();
        }

        function clearData() {
            userStats = { recent: [], counts: {} };
            saveStats();
            showToast("Dati cancellati");
        }

        function trackUsage(symbol) {
            // Update Recent
            // Remove if exists to bubble to top
            userStats.recent = userStats.recent.filter(s => s !== symbol);
            userStats.recent.unshift(symbol);
            if (userStats.recent.length > 14) userStats.recent.pop();

            // Update Counts
            userStats.counts[symbol] = (userStats.counts[symbol] || 0) + 1;

            saveStats();
        }

        function getSymbolObject(char) {
            for (const cat of LIBRARY) {
                const found = cat.items.find(i => i.val === char);
                if (found) return found;
            }
            return { val: char, name: 'Unknown', tags: [] };
        }

        // --- Rendering ---
        
        function createSymbolCard(item) {
            const div = document.createElement('div');
            div.className = 'symbol-card';
            div.setAttribute('title', item.name); // Simple tooltip
            div.innerHTML = `<span class="symbol ${item.tags.includes('index') || item.tags.includes('exponent') ? 'small' : ''}">${item.val}</span>`;
            
            div.onclick = () => {
                navigator.clipboard.writeText(item.val);
                showToast(`Copiato: ${item.val}`);
                trackUsage(item.val);
            };
            return div;
        }

        function renderStats() {
            const usageSection = document.getElementById('usageSection');
            const recentGrid = document.getElementById('recentGrid');
            const frequentGrid = document.getElementById('frequentGrid');

            recentGrid.innerHTML = '';
            frequentGrid.innerHTML = '';

            if (userStats.recent.length === 0) {
                usageSection.style.display = 'none';
                return;
            }

            usageSection.style.display = 'block';

            // Render Recent
            userStats.recent.forEach(char => {
                const item = getSymbolObject(char);
                recentGrid.appendChild(createSymbolCard(item));
            });

            // Render Frequent (Top 14)
            const sorted = Object.entries(userStats.counts)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 14)
                .map(([char]) => char);

            sorted.forEach(char => {
                const item = getSymbolObject(char);
                frequentGrid.appendChild(createSymbolCard(item));
            });
        }

        function renderCategories(data) {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            const noResults = document.getElementById('noResults');
            
            let hasAny = false;

            data.forEach(cat => {
                if (cat.items.length === 0) return;

                const wrapper = document.createElement('div');
                wrapper.className = 'category-wrapper'; // New wrapper class for spacing
                
                const title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = cat.category;
                
                const grid = document.createElement('div');
                grid.className = 'symbol-grid';

                cat.items.forEach(item => {
                    grid.appendChild(createSymbolCard(item));
                });

                wrapper.appendChild(title);
                wrapper.appendChild(grid);
                container.appendChild(wrapper);
                hasAny = true;
            });

            noResults.style.display = hasAny ? 'none' : 'block';
        }

        function handleSearch(query) {
            const usageSection = document.getElementById('usageSection');
            
            // Usage stats always visible if they exist!
            if (userStats.recent.length > 0) {
                 usageSection.style.display = 'block';
            }

            // If empty, show full library
            if (!query) {
                renderCategories(LIBRARY);
                return;
            }

            // Filter library
            const filtered = LIBRARY.map(cat => {
                return {
                    category: cat.category,
                    items: cat.items.filter(item => {
                        const matchVal = item.val.toLowerCase().includes(query);
                        const matchName = item.name.toLowerCase().includes(query);
                        const matchTags = item.tags.some(t => t.toLowerCase().includes(query));
                        return matchVal || matchName || matchTags;
                    })
                };
            }).filter(cat => cat.items.length > 0);

            renderCategories(filtered);
        }

        // Output toast
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        let toastTimeout;

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1000);
        }

        // Start
        init();

    </script>
</body>
</html>
