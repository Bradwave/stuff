    <script>
        // Utility: check if value is a valid numeric grade (not NaN, null or missing)
        function isNumeric(v) {
            return v !== null && typeof v === 'number' && !isNaN(v);
        }

        // Utility: parse CSV with comma/period decimals, missing values as NaN
        function parseCSVToObject(csv) {
            const lines = csv.trim().split(/\r?\n/);
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                // Split respecting quoted commas
                const cols = [];
                let cur = '', inQuotes = false;
                for (let i = 0; i < line.length; ++i) {
                    const c = line[i];
                    if (c === '"') inQuotes = !inQuotes;
                    else if (c === ',' && !inQuotes) { cols.push(cur); cur = ''; }
                    else cur += c;
                }
                cols.push(cur);
                // Pad missing columns
                while (cols.length < headers.length) cols.push('');
                const obj = {};
                headers.forEach((h, i) => {
                    let v = (cols[i] || '').replace(/"/g, '').trim();
                    // Convert grades to numbers, handle both dot and comma decimals
                    if (i > 1 && v !== '') v = parseFloat(v.replace(',', '.'));
                    else if (i > 1) v = NaN;
                    obj[h] = v;
                });
                return obj;
            });
        }

        // Color for grade: green (≥6), red (<6), shade by value
        
        function gradeColor(v) {
            if (isNaN(v)) return 'transparent'; // Should not happen for dots (we filter) but safe
             return v >= 6 ? '#1ec01e' : '#d21919';
        }

        // Global State
        let GLOBAL_datasets = []; 
        let GLOBAL_activeDatasetId = null;
        let IS_PRIVACY_MODE = false;
        let PRIVACY_MAP = new Map(); // Real Name -> Alias
        let PRIVACY_SHUFFLE = []; // Array of indices shuffled

        // Helper to get active dataset
        function getActiveDataset() {
            return GLOBAL_datasets.find(d => d.id === GLOBAL_activeDatasetId);
        }

        // Helper to get previous dataset (chronologically before active)
        function getPreviousDataset() {
            if (!GLOBAL_activeDatasetId || GLOBAL_datasets.length < 2) return null;
            const active = getActiveDataset();
            if (!active) return null;
            // Sort by date descending
            const sorted = GLOBAL_datasets.slice().sort((a, b) => b.dateObj - a.dateObj);
            const idx = sorted.findIndex(d => d.id === active.id);
            // Previous is the one after active in descending list (older)

        function loadState() {

                GLOBAL_datasets = state.datasets.map(d => {
                    // Reconstruct derived stats
                    const subjects = d.subjects;

                    // Re-calculate averages as they are not saved or need function references
                     const classAvg = subjects.map((_, i) => {
                        const vals = students.map(s => s.grades[i]).filter(isNumeric);
                        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : NaN;
                    });
                    const allVals = students.flatMap(s => s.grades.filter(isNumeric));
                    const overallAvg = allVals.length ? allVals.reduce((a,b)=>a+b,0)/allVals.length : NaN;

                    return {
                        id: d.id,
                        name: d.name,
                        dateObj: new Date(d.dateStr),
                        subjects,
                        students,
                        classAvg,
                        overallAvg
                    };

                    GLOBAL_activeDatasetId = GLOBAL_datasets[0].id;

        // Add a new dataset
        function addDataset(csv, filename) {
            const data = parseCSVToObject(csv);
            // Basic validation
            if (!data || !data.length) return;
            
            const subjects = Object.keys(data[0]).slice(2);
            const students = data.map(row => ({
                id: row[Object.keys(row)[0]],
                name: row[Object.keys(row)[1]],
                grades: subjects.map(s => row[s])
            }));

            // Compute class averages per subject
            // Compute class averages per subject
            const classAvg = subjects.map((_, i) => {
                const vals = students.map(s => s.grades[i]).filter(isNumeric);
                return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : NaN;
            });

            // overall average
            const allVals = students.flatMap(s => s.grades.filter(isNumeric));
            const overallAvg = allVals.length ? allVals.reduce((a,b)=>a+b,0)/allVals.length : NaN;

            // Generate ID and Date
            const id = 'ds_' + Date.now() + '_' + Math.floor(Math.random()*1000);
            
            // Try to guess date from filename (e.g. "novembre", "2024-11") or use current
            let dateName = filename.replace('.csv', '');
            let dateObj = new Date();
            
            // Simple heuristic for month names in Italian
            const months = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
            const lowerName = filename.toLowerCase();
            const foundMonthIdx = months.findIndex(m => lowerName.includes(m));
            if (foundMonthIdx !== -1) {
                // If year is not found, assume current year or academic year logic? 
                // For simplicity, default to current year.
                dateObj = new Date(new Date().getFullYear(), foundMonthIdx, 1);
            } else {
                // otherwise check if we can parse YYYY-MM
                const match = filename.match(/(\d{4})[-_](\d{1,2})/);
                if(match) {
                     dateObj = new Date(parseInt(match[1]), parseInt(match[2])-1, 1);
                }
            }

            const newDataset = {
                id,
                name: dateName, // Initial name is filename
                dateObj: dateObj,
                students: students,
                subjects: subjects,
                classAvg: classAvg,
                overallAvg: overallAvg
            };

            GLOBAL_datasets.push(newDataset);
            
            // Sort by date descending
            sortDatasets();

            // Setup UI
            updateDatasetSelector();
            renderDatasetList(); // Update modal list if open
            if(GLOBAL_datasets.length === 1) {
                setActiveDataset(id);
            } else {
                saveState(); // just save if added
            }
        }

        // Color interpolation helper
        function interpolateColor(color1, color2, factor) {
            const r1 = parseInt(color1.substring(1, 3), 16);
            const g1 = parseInt(color1.substring(3, 5), 16);
            const b1 = parseInt(color1.substring(5, 7), 16);
            const r2 = parseInt(color2.substring(1, 3), 16);
            const g2 = parseInt(color2.substring(3, 5), 16);
            const b2 = parseInt(color2.substring(5, 7), 16);
            const r = Math.round(r1 + factor * (r2 - r1));
            const g = Math.round(g1 + factor * (g2 - g1));
            const b = Math.round(b1 + factor * (b2 - b1));
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function getGradeStyle(val) { 
            if (val === null || isNaN(val)) return { bg: '#eea', color: '#888' }; // Should use specific dash style from render
            if (val >= 6) {
                // 6 -> 10 : Light Green to Dark Green
                const factor = Math.min(1, Math.max(0, (val - 6) / 4.0));
                // If val > 9, use white text for contrast against dark green
                const color = val > 9 ? '#fff' : '#003300';
                return { bg: interpolateColor('#e8f5e9', '#66bb6a', factor), color: color };
            } else {
                // < 6 -> 2 : shades of RED
                // 6 (almost) -> Light Red (#ffebee)
                // 2 -> Dark Red (#b71c1c)
                const factor = Math.min(1, Math.max(0, (6 - val) / 4.0));
                const bg = interpolateColor('#ffebee', '#c62828', factor);
                // Text color: if bg is dark, use white
                const textColor = factor > 0.5 ? '#fff' : '#000';
                return { bg: bg, color: textColor };
            }
        }

        function yellowShade(val, max) {
            if (val === 0) return 'yellow-shade-1';
            if (val < max * 0.25) return 'yellow-shade-2';
            if (val < max * 0.5) return 'yellow-shade-3';
            if (val < max * 0.75) return 'yellow-shade-4';
            return 'yellow-shade-5';
        }

                         ratioAvg: (function(){ const vals = ratiosArr.filter(v=>!isNaN(v)); return vals.length ? mean(vals) : NaN; })()
                     };
                     
                     // Set Navigation Context
                     NAV_CTX = {
                         students: students, // Current sorted/filtered/anonymized list
                         index: idx, // Index in that list
                         subjects: subjects,
                         classAvg: classAvg,
                         stats: stats,
                         overallAvg: overallAvg
                     };
                     
                     showChart(s, subjects, classAvg, stats);
                };
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            // Helper stats functions
            function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }
            function stddev(arr) { const m = mean(arr); return Math.sqrt(arr.reduce((s, x) => s + (x - m) * (x - m), 0) / arr.length); }
            function pearson(x, y) {
                if (x.length !== y.length || x.length < 2) return NaN;
                const mx = mean(x), my = mean(y);
                const num = x.reduce((s, xi, i) => s + (xi - mx) * (y[i] - my), 0);
                const sx = Math.sqrt(x.reduce((s, xi) => s + (xi - mx) * (xi - mx), 0));
                const sy = Math.sqrt(y.reduce((s, yi) => s + (yi - my) * (yi - my), 0));
                const den = sx * sy;
                return den === 0 ? NaN : num / den;
            }

            // Build footer rows: class mean, std dev, correlation (subject vs student overall avg)
            const tfoot = document.createElement('tfoot');
            // overall class average across all numeric grades
            const allVals = students.flatMap(s => s.grades.filter(isNumeric));
            const overallAvgCalc = allVals.length ? allVals.reduce((a, b) => a + b, 0) / allVals.length : NaN;
            // Use dataset.overallAvg or calculated one (should be same)
            const overallAvgVal = dataset.overallAvg;
            const overallStd = allVals.length ? stddev(allVals) : NaN;
            // Compute per-student summary arrays for the right-hand columns (<6 count, deficit sum, deficit medio)
            // Filter out students with no recorded grades to avoid pulling down class averages.
            const studentsWithData = students.filter(s => s.grades.some(isNumeric));
            const belowCounts = studentsWithData.map(s => s.grades.filter(g => isNumeric(g) && g < 6).length);
            const deficitsArr = studentsWithData.map(s => s.grades.filter(g => isNumeric(g) && g < 6).reduce((a, b) => a + (6 - b), 0));
            const ratiosArr = belowCounts.map((b, i) => b > 0 ? (deficitsArr[i] / b) : NaN);
            const fmt = v => (isNaN(v) ? '' : v.toFixed(2));

            // Media classe row

            avgRow.innerHTML = `<th colspan="2">Media classe ${isNaN(overallAvgVal) ? '' : `<strong>${fmt(overallAvgVal)}</strong>`}</th>` +
                `<td></td>` + // Empty cell for new Avg column
                subjects.map((_, i) => `<td>${fmt(classAvg[i])}</td>`).join('') +
                `<td class="sep-col">${fmt(mean(belowCounts))}</td>` +
                `<td class="sep-col">${fmt(mean(deficitsArr))}</td>` +
                `<td class="sep-col">${fmt((function(){ const vals = ratiosArr.filter(isNumeric); return vals.length? mean(vals) : NaN; })())}</td>`;
            tfoot.appendChild(avgRow);

            // Standard deviation row
            const sdRow = document.createElement('tr');
            const sdCells = subjects.map((_, i) => {
                const vals = students.map((s, si) => s.grades[i]).filter(isNumeric);
                return `<td>${isNaN(vals[0]) ? '' : stddev(vals).toFixed(2)}</td>`;
            }).join('');
            sdRow.innerHTML = `<th colspan="2">Dev. std ${isNaN(overallStd) ? '' : `<strong>${fmt(overallStd)}</strong>`}</th><td></td>` + sdCells + `<td class="sep-col"></td><td class="sep-col"></td><td class="sep-col"></td>`;
            tfoot.appendChild(sdRow);

            // Correlation row (subject grade vs student overall average)
            const corrRow = document.createElement('tr');
            const corrCells = subjects.map((_, i) => {
                const x = [];
                const y = [];
                students.forEach((s, si) => {
                    const gv = s.grades[i];
                    const av = studentAvgs[si];
                    if (isNumeric(gv) && isNumeric(av)) { x.push(gv); y.push(av); }
                });
                const c = pearson(x, y);
                return `<td>${isNaN(c) ? '' : c.toFixed(2)}</td>`;
            }).join('');
            corrRow.innerHTML = `<th colspan="2">Corr. vs media stud.</th><td></td>` + corrCells + `<td class="sep-col"></td><td class="sep-col"></td><td class="sep-col"></td>`;
            tfoot.appendChild(corrRow);

            table.appendChild(tfoot);

            // Add click handlers to footer: subject averages -> show subject histogram
            (function attachFooterHandlers() {
                try {
                    const avgRow = tfoot.querySelector('tr');
                    if (!avgRow) return;
                    // first cell is TH colspan=2 (Media classe) - make clickable to show histogram of student averages
                    const firstTh = avgRow.querySelector('th');
                    if (firstTh) {
                        firstTh.style.cursor = 'pointer';
                        firstTh.title = 'Clicca per mostrare distribuzione medie studenti';
                        firstTh.addEventListener('click', () => {
                            // compute student overall averages
                            // Use active dataset
                            const dataset = getActiveDataset();
                            const vals = dataset.students.map(s => {
                                const vs = s.grades.filter(isNumeric);
                                return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : NaN;
                            }).filter(isNumeric);
                            // compute overall avg and stddev of student averages
                            const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
                            const sd = arr => { const m=mean(arr); return Math.sqrt(arr.reduce((s,x)=>s+(x-m)*(x-m),0)/arr.length); };
                            const overallAvgStudents = vals.length ? mean(vals) : NaN;
                            const overallSdStudents = vals.length ? sd(vals) : NaN;
                            showHistogram('Distribuzione: Medie studenti', vals, { overallAvg: overallAvgStudents, overallStd: overallSdStudents });
                        });
                    }
                    // subject tds follow
                    const tds = Array.from(avgRow.querySelectorAll('td'));
                    // subjects are the first subjects.length tds
                    for (let i = 0; i < subjects.length; i++) {
                        const td = tds[i];
                        if (!td) continue;
                        td.style.cursor = 'pointer';
                        td.title = `Clicca per mostrare distribuzione voti in ${subjects[i]}`;
                        td.addEventListener('click', () => {
                            // gather raw values for this subject (keeping order) and compute stats
                            // We need to fetch data from the *Active* dataset (or currently selected in histogram? default active)
                            const dataset = getActiveDataset();
                            const valsAll = dataset.students.map(s => s.grades[i]);
                            const vals = valsAll.filter(isNumeric);
                            const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
                            const sd = arr => { const m=mean(arr); return Math.sqrt(arr.reduce((s,x)=>s+(x-m)*(x-m),0)/arr.length); };
                            const subjAvg = vals.length ? mean(vals) : NaN;
                            const subjStd = vals.length ? sd(vals) : NaN;
                            // compute correlation
                            const studentAvgs = dataset.students.map(s => {
                                const vs = s.grades.filter(isNumeric);
                                return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : NaN;
                            });
                            const x = [], y = [];
                            dataset.students.forEach((s, idx) => {
                                const gv = s.grades[i];
                                const av = studentAvgs[idx];
                                if (isNumeric(gv) && isNumeric(av)) { x.push(gv); y.push(av); }
                            });
                            const pearson = (a,b) => {
                                if (a.length !== b.length || a.length < 2) return NaN;
                                const ma = a.reduce((s,x)=>s+x,0)/a.length;
                                const mb = b.reduce((s,x)=>s+x,0)/b.length;
                                const num = a.reduce((s,ai,i)=>s+(ai-ma)*(b[i]-mb),0);
                                const sa = Math.sqrt(a.reduce((s,ai)=>s+(ai-ma)*(ai-ma),0));
                                const sb = Math.sqrt(b.reduce((s,bi)=>s+(bi-mb)*(bi-mb),0));
                                const den = sa*sb; return den===0?NaN:num/den;
                            };
                            const corr = pearson(x,y);
                            showHistogram(`Distribuzione: ${subjects[i]}`, vals, { subjAvg, subjStd, corr }, subjects[i]);
                        });
                    }
                } catch (e) { /* ignore */ }
            })();

            // Attach sorting handlers to the header cells
            (function attachSortHandlers(tbl, studentsData, studentAvgsData) {
                const ths = tbl.querySelectorAll('th.sortable');
                // map id -> avg for fast lookup when sorting by average
                const idToAvg = {};
                studentsData.forEach((st, i) => { idToAvg[String(st.id)] = studentAvgsData[i]; });

                ths.forEach(th => th.addEventListener('click', () => {
                    const col = parseInt(th.getAttribute('data-col'));
                    // special-case: name column toggles between alphabetical and order-by-average
                    if (col === 1) {
                        const mode = tbl.dataset.nameSortMode === 'alpha' ? 'avg' : 'alpha';
                        tbl.dataset.nameSortMode = mode;
                        tbl.querySelectorAll('th').forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
                        if (mode === 'alpha') {
                            sortTable(tbl, 1, 'asc');
                            th.classList.add('sorted-asc');
                            th.querySelector('.sort-method').textContent = '(Ordina: Nome)';
                        } else {
                            sortByAvg(tbl, 'desc');
                            th.classList.add('sorted-desc');
                            th.querySelector('.sort-method').textContent = '(Ordina: Media)';
                        }
                        tbl.dataset.sortCol = col; tbl.dataset.sortDir = mode === 'alpha' ? 'asc' : 'desc';
                        return;
                    }

                    const currentCol = parseInt(tbl.dataset.sortCol);
                    let dir = tbl.dataset.sortDir === 'asc' ? 'desc' : 'asc';
                    if (currentCol !== col) dir = 'asc';
                    sortTable(tbl, col, dir);
                    // update header indicators
                    tbl.querySelectorAll('th').forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
                    th.classList.add(dir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                    tbl.dataset.sortCol = col; tbl.dataset.sortDir = dir;
                }));

                function getCellValue(row, colIndex) {
                    const cell = row.children[colIndex];
                    if (!cell) return '';
                    return cell.textContent.trim();
                }

                function sortTable(tbl, colIndex, dir) {
                    const tbody = tbl.querySelector('tbody');
                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    // Decide if numeric column by checking first few values
                    let numeric = true;
                    for (let r of rows) {
                        const v = getCellValue(r, colIndex);
                        if (v === '') continue;
                        if (isNaN(parseFloat(v.replace(',', '.')))) { numeric = false; break; }
                    }
                    const compare = (a, b) => {
                        const va = getCellValue(a, colIndex);
                        const vb = getCellValue(b, colIndex);
                        if (numeric) {
                            const na = parseFloat(va.replace(',', '.'));
                            const nb = parseFloat(vb.replace(',', '.'));
                            const aNan = isNaN(na), bNan = isNaN(nb);
                            if (aNan && bNan) return 0;
                            if (aNan) return 1;
                            if (bNan) return -1;
                            return na - nb;
                        } else {
                            return va.localeCompare(vb, undefined, { numeric: true, sensitivity: 'base' });
                        }
                    };
                    rows.sort((a, b) => compare(a, b) * (dir === 'asc' ? 1 : -1));
                    // Re-append rows in sorted order
                    rows.forEach(r => tbody.appendChild(r));
                }

                function sortByAvg(tbl, dir) {
                    const tbody = tbl.querySelector('tbody');
                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort((a, b) => {
                        const ida = getCellValue(a, 0);
                        const idb = getCellValue(b, 0);
                        const va = idToAvg[String(ida)];
                        const vb = idToAvg[String(idb)];
                        const aNan = isNaN(va), bNan = isNaN(vb);
                        if (aNan && bNan) return 0;
                        if (aNan) return 1;
                        if (bNan) return -1;
                        return (va - vb) * (dir === 'asc' ? 1 : -1);
                    });
                    rows.forEach(r => tbody.appendChild(r));
                }
            })(table, students, studentAvgs);
            wrapper.appendChild(table);
            app.appendChild(wrapper);
        }
        // Helper to animate closing popups and restore UI state with synchronized blur fade
        function closeWithAnim(modal, popupId, onClosed) {
            const popup = document.getElementById(popupId);
            const mainContent = document.getElementById('main-content');
            if (popup) popup.classList.add('closing');
            if (mainContent) mainContent.classList.add('closing');
            setTimeout(() => {
                if (popup) popup.classList.remove('closing');
                if (mainContent) mainContent.classList.remove('closing', 'blur');
                modal.classList.remove('active');
                try { if (typeof onClosed === 'function') onClosed(); } catch(e) {}
            }, 220);
        }

        // Radar chart as modal popup
        let CHART_HISTORY = [];
        let CHART_FOCUSED_INDEX = -1; // -1 means default view (latest focused)

        function showChart(student, subjects, classAvg, stats) {
            // Update NAV_CTX if this is an "external" call (not from navigation itself)
            // But how do we distinguish? 
            // We can detect if `student` is already in NAV_CTX or just check if the logic flow came from `navigateStudent`.
            // Actually, `navigateStudent` updates index and calls showChart.
            // If called from `renderTable` click, we need to initialize NAV_CTX.
            
            // To be safe, if we are NOT navigating (implicit check), we generally set it up.
            // But simpler: `renderTable` should populate NAV_CTX before calling `showChart`, OR pass it.
            // Let's modify `showChart` to NOT reset NAV_CTX if it's already set for this student?
            // No, `renderTable` has the context of the list. `navigateStudent` has the context.
            // `showChart` is just the displayer.
            // So we need to set NAV_CTX in the `onclick` handler in `renderTable`.
            
            const modal = document.getElementById('radar-modal');
            const title = document.getElementById('radar-title');
            title.textContent = student.name;
            const hc = document.getElementById('histogram-controls');
            modal.classList.add('active');
            document.getElementById('main-content').classList.add('blur');
            //ensure histogram controls are hidden and stats panel visible
            // const statsPanel = document.getElementById('radar-stats');
            // if (hc) hc.style.display = 'none';
            // if (statsPanel) statsPanel.style.display = '';

            // 1. Gather History for this student
            // We match by ID preferably, or Name
            const sortedDatasets = GLOBAL_datasets.slice().sort((a,b) => a.dateObj - b.dateObj);
            const history = sortedDatasets.map(ds => {
                const s = ds.students.find(x => x.id === student.id || x.name === student.name);
                return s ? { dataset: ds, student: s } : null;
            }).filter(x => x);

            CHART_HISTORY = history;
            // Default focus is the last one (latest)
            CHART_FOCUSED_INDEX = history.length - 1;

            // Re-render canvas
            const popup = document.getElementById('radar-popup');
            
            // Remove old chart container if exists? Actually we just clear canvas context or destroy chart
            // For now let's reuse valid container
            let container = popup.querySelector('.chart-container');
            if(!container) {
                 container = document.createElement('div');
                 container.className = 'chart-container';
                 popup.appendChild(container); // should append at right place?
            }
             
            // Check canvas
            let newCanvas = container.querySelector('canvas');
            if(!newCanvas) {
                newCanvas = document.createElement('canvas'); 
                newCanvas.id = 'chart';
                container.appendChild(newCanvas);
            }

            const ctx = newCanvas.getContext('2d');
            
            if (chart) { try { chart.destroy(); } catch (e) {} chart = null; }

            renderRadar(ctx, true);
        }

        function renderRadar(ctx, animate = false) {
            const dataset = getActiveDataset();
            if (!dataset) return;

            // Ensure we have history
            if (!CHART_HISTORY.length) return;

            // 0. Update Stats for FOCUSED entry
            const focusedEntry = CHART_HISTORY[CHART_FOCUSED_INDEX];
            if (focusedEntry) {
                updateRadarStats(focusedEntry.student, focusedEntry.dataset);
            }

            const subjects = dataset.subjects;
            
            // Identify Previous Dataset for Trends
            const sorted = GLOBAL_datasets.slice().sort((a,b) => a.dateObj - b.dateObj);
            const currentIdx = sorted.findIndex(d => d.id === dataset.id);
            const prevDataset = (currentIdx > 0) ? sorted[currentIdx - 1] : null;

            // Prepare Trend Infos for the FOCUSED student
            let trendInfos = subjects.map(s => ({ label: s, arrow: '', color: 'transparent' }));
            
            if (CHART_FOCUSED_INDEX !== -1 && prevDataset) {
                // ... trend calculation ...
                // We need to compare FOCUSED student with their previous self
                const fStudent = focusedEntry.student;
                // Find same student in PREV dataset (relative to focused dataset? Or relative to time?)
                // The logical trend is: Focused Dataset vs Previous Dataset.
                // But CHART_HISTORY contains multiple datasets.
                // Let's stick to comparing Focused Student vs Previous Dataset in Global List
                // (This logic was slightly ambiguous before, but let's keep it simple: Compare current FOCUSED grade vs Prev Dataset grade)
                
                // Re-find prev dataset relative to FOCUSED key
                const fDataset = focusedEntry.dataset;
                const fSortedIdx = sorted.findIndex(d => d.id === fDataset.id);
                const fPrevDataset = (fSortedIdx > 0) ? sorted[fSortedIdx - 1] : null;
                
                if (fPrevDataset) {
                    const fPrevStudent = fPrevDataset.students.find(s => s.name === fStudent.name);
                    if (fPrevStudent) {
                         trendInfos = subjects.map((subj, i) => {
                            const currG = fStudent.grades[i];
                            const prevSubjIdx = fPrevDataset.subjects.indexOf(subj);
                            const prevG = (prevSubjIdx !== -1) ? fPrevStudent.grades[prevSubjIdx] : null;
                            let arrow = ''; let color = 'transparent';
                            if (currG !== null && !isNaN(currG) && prevG !== null && !isNaN(prevG)) {
                                const diff = currG - prevG;
                                if (diff > 0.1) { arrow = '▲'; color = '#10b981'; } 
                                else if (diff < -0.1) { arrow = '▼'; color = '#ef4444'; } 
                                else { arrow = '─'; color = '#94a3b8'; }
                            }
                            return { label: subj, arrow, color };
                         });
                    }
                }
            }

            // Main Datasets
            const sets = [];
            
            // 1. History (Focused & Others)
            CHART_HISTORY.forEach((entry, idx) => {
                const s = entry.student;
                const dsSource = entry.dataset;
                const isFocused = (idx === CHART_FOCUSED_INDEX);
                
                // STYLE: Focused = Bold Blue. Others = Thin Blue (no dash).
                const borderColor = isFocused ? '#2563eb' : 'rgba(37, 99, 235, 0.45)'; 
                const bgColor = isFocused ? 'rgba(37, 99, 235, 0.1)' : 'transparent';
                const borderWidth = isFocused ? 5 : 1;
                const pointRadius = isFocused ? 5 : 3;
                
                // Align grades to current subjects (in case datasets differ)
                const alignedGrades = alignGradesToSubjects(s, dsSource.subjects, subjects);
                
                const ptColors = alignedGrades.map(g => {
                    if (g === null || isNaN(g)) return 'transparent';
                    return (g >= 6 ? '#16a34a' : '#dc2626');
                });
                
                sets.push({
                    label: dsSource.name, // SHOW DATASET NAME (CSV) NOT STUDENT NAME
                    data: alignedGrades,
                    fill: isFocused,
                    backgroundColor: bgColor,
                    borderColor: borderColor,
                    pointBackgroundColor: ptColors,
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1,
                    pointRadius: pointRadius,
                    pointHoverRadius: pointRadius + 2,
                    borderWidth: borderWidth,
                    borderDash: [], // No dashes for history anymore
                    order: isFocused ? 0 : 10,
                    _historyIndex: idx 
                });
            });

            // 2. Class Average
            sets.push({
                 label: 'Media Classe',
                 data: dataset.classAvg,
                 borderColor: '#f97316', 
                 backgroundColor: 'transparent',
                 pointRadius: 0,
                 borderWidth: 2,
                 borderDash: [5,5],
                 order: 100
            });

            // 3. Limit 6
            sets.push({
                label: 'Sufficienza',
                data: new Array(subjects.length).fill(6),
                borderColor: '#475569', 
                backgroundColor: 'transparent',
                pointRadius: 0,
                borderWidth: 1,
                borderDash: [2,2],
                order: 101
            });

            // --- Plugin: Value Labels (Grades) ---
            const valPlugin = {
                id: 'valPlugin',
                afterDatasetsDraw(chart) {
                    const ctx = chart.ctx;
                    const rScale = chart.scales.r;
                    const xCenter = rScale.xCenter;
                    const yCenter = rScale.yCenter;

                    chart.data.datasets.forEach((ds, i) => {
                        if (ds._historyIndex === CHART_FOCUSED_INDEX) {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((element, index) => {
                                const val = ds.data[index];
                                if (val !== null && !isNaN(val)) {
                                    const ex = element.x;
                                    const ey = element.y;
                                    const dx = xCenter - ex;
                                    const dy = yCenter - ey;
                                    const dist = Math.sqrt(dx*dx + dy*dy);
                                    
                                    const offset = 25; // Increased offset (from 15)
                                    const u = dx / dist;
                                    const v = dy / dist;
                                    
                                    const tx = ex + u * offset;
                                    const ty = ey + v * offset;
                                    
                                    ctx.save();
                                    ctx.font = 'bold 14px "Azeret Mono"';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    
                                    const color = Array.isArray(ds.pointBackgroundColor) ? ds.pointBackgroundColor[index] : ds.pointBackgroundColor;
                                    
                                    ctx.strokeStyle = '#ffffff';
                                    ctx.lineWidth = 3;
                                    ctx.strokeText(val, tx, ty);
                                    
                                    ctx.fillStyle = color || '#000';
                                    ctx.fillText(val, tx, ty);
                                    
                                    ctx.restore();
                                }
                            });
                        }
                    });
                }
            };

            // --- Plugin: HTML Labels Overlay (Subjects + Arrows) ---
            const htmlLabelPlugin = {
                id: 'htmlLabelPlugin',
                afterRender(chart) {
                     const container = chart.canvas.parentNode;
                     if(getComputedStyle(container).position === 'static') {
                         container.style.position = 'relative'; 
                     }
                     
                     let overlay = container.querySelector('.radar-labels-overlay');
                     if(overlay) overlay.remove();
                     
                     overlay = document.createElement('div');
                     overlay.className = 'radar-labels-overlay';
                     Object.assign(overlay.style, {
                         pointerEvents: 'none', position: 'absolute',
                         top: '0', left: '0', width: '100%', height: '100%'
                     });
                     container.appendChild(overlay);

                     const rScale = chart.scales.r;
                     const maxVal = rScale.max;
                     
                     chart.data.labels.forEach((label, i) => {
                         // Position: outside max value. 
                         // Closer to radar: maxVal + 0.8
                         const point = rScale.getPointPositionForValue(i, maxVal + 0.8);
                         const info = trendInfos[i];
                         
                         const div = document.createElement('div');
                         Object.assign(div.style, {
                             position: 'absolute',
                             left: `${point.x}px`,
                             top: `${point.y}px`,
                             transform: 'translate(-50%, -50%)',
                             textAlign: 'center',
                             fontFamily: '"Azeret Mono", monospace',
                             fontSize: '11px',
                             fontWeight: '600',
                             color: '#475569',
                             whiteSpace: 'nowrap',
                             textShadow: '0 0 4px #ffffff'
                         });
                         
                         div.innerHTML = `${info.label} <span style="color:${info.color}; font-size:12px; margin-left:4px;">${info.arrow}</span>`;
                         overlay.appendChild(div);
                     });
                }
            };

            // Create Chart
            if(chart) chart.destroy();
            

            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: subjects,
                    datasets: sets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: 10 }, // Reduced padding to bring labels closer effectively? No, overlay uses absolute.
                    animation: { duration: animate ? 800 : 0 },
                    scales: {
                        r: {
                            min: 0, max: 10,
                            ticks: {
                                stepSize: 2,
                                display: false, 
                                backdropColor: 'transparent'
                            },
                            pointLabels: { display: false }, 
                            grid: {
                                color: (ctx) => (ctx.tick.value === 6 ? '#64748b' : '#cbd5e1'), // Darker limit and grid
                                lineWidth: (ctx) => (ctx.tick.value === 6 ? 2 : 1)
                            },
                            angleLines: { color: '#cbd5e1' } // Darker angle lines
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {

            // `renderRadar` calls `updateRadarStats(focusedEntry.student...)`.
            // Ah, there is `renderRadar` logic using `updateRadarStats`.

        function alignGradesToSubjects(student, sourceSubjects, targetSubjects) {
            // Map grades from source order to target order
            return targetSubjects.map(ts => {
                const idx = sourceSubjects.indexOf(ts);
                if (idx === -1) return null;
                const v = student.grades[idx];
                return isNaN(v) ? null : v;
            });
        }

        function updateRadarStats(student, dataset) {
             const grades = student.grades;
             const below = grades.filter(g => isNumeric(g) && g < 6).length;
             const deficit = grades.filter(g => isNumeric(g) && g < 6).reduce((a, b) => a + (6 - b), 0);
             const ratio = below > 0 ? (deficit / below) : NaN;
             const vals = grades.filter(isNumeric);
             const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : NaN;
             const classOverall = dataset.overallAvg;

             const sb = document.getElementById('stat-below');
             const sd = document.getElementById('stat-deficit');
             const sr = document.getElementById('stat-ratio');
             const ss = document.getElementById('stat-score');

             if(sb) sb.textContent = below;
             if(sd) sd.textContent = deficit.toFixed(2);
             if(sr) sr.textContent = isNaN(ratio) ? '-' : ratio.toFixed(2);
             
             if(ss) {
                 if (!isNaN(avg) && !isNaN(classOverall)) {
                     const diff = avg - classOverall;
                     const sign = diff > 0 ? '+' : '';
                     const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
                     const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '─');
                     ss.innerHTML = `${sign}${diff.toFixed(2)} <span class="stat-arrow ${cls}">${arrow}</span>`;
                 } else {
                     ss.textContent = '-';
                 }
             }
        }


        // Show a histogram in the same modal using the #chart canvas

        let histChart = null;

        function showHistogram(title, values, opts, subjectName) {
            const modal = document.getElementById('histogram-modal');
            const titleEl = document.getElementById('histogram-title');
            const slider = document.getElementById('hist-bin-width');
            const sliderLabel = document.getElementById('hist-bin-label');
            const popup = document.getElementById('histogram-popup');
            const canvas = document.getElementById('histogram-chart');
            const histStatsEl = document.getElementById('hist-stats');

            titleEl.textContent = title;
            if (sliderLabel && slider) sliderLabel.textContent = slider.value;

            // Remove old trend chart if any (it might be inserted by previous calls)
            const oldTrend = popup.querySelector('#trend-chart-container');
            if (oldTrend) oldTrend.remove();

            // Populate generic stats
            if (histStatsEl) {
                if (opts && (typeof opts.subjAvg !== 'undefined' || typeof opts.overallAvg !== 'undefined')) {
                    // build content depending on opts
                    let parts = [];
                    if (typeof opts.subjAvg !== 'undefined') parts.push(`<div class="radar-stat"><span class="label">Media:</span><span class="value">${isNaN(opts.subjAvg)?'-':opts.subjAvg.toFixed(2)}</span></div>`);
                    if (typeof opts.subjStd !== 'undefined') parts.push(`<div class="radar-stat"><span class="label">Dev. std:</span><span class="value">${isNaN(opts.subjStd)?'-':opts.subjStd.toFixed(2)}</span></div>`);
                    if (typeof opts.corr !== 'undefined') parts.push(`<div class="radar-stat"><span class="label">Corr. vs media stud.:</span><span class="value">${isNaN(opts.corr)?'-':opts.corr.toFixed(2)}</span></div>`);
                    if (typeof opts.overallAvg !== 'undefined') parts.unshift(`<div class="radar-stat"><span class="label">Media generale:</span><span class="value">${isNaN(opts.overallAvg)?'-':opts.overallAvg.toFixed(2)}</span></div>`);
                    if (typeof opts.overallStd !== 'undefined') parts.push(`<div class="radar-stat"><span class="label">Dev. std generale:</span><span class="value">${isNaN(opts.overallStd)?'-':opts.overallStd.toFixed(2)}</span></div>`);
                    histStatsEl.innerHTML = parts.join('');
                    histStatsEl.style.display = 'flex';

                    histStatsEl.style.display = 'none';

                }
            }
            
            // IF Subject: Show Trend Plot & Dataset Selector

            if (subjectName) {

                sel.className = 'trend-select';
                
                // Populate selector

                    const dStr = ds.dateObj.toLocaleDateString('it-IT', { month: 'short', year: 'numeric' });
                    opt.textContent = `${ds.name} (${dStr})`;
                    if (ds.id === GLOBAL_activeDatasetId) opt.selected = true;
                    sel.appendChild(opt);
                });
                
                sel.onchange = (e) => {
                    // Update Histogram Data
                    const newDs = GLOBAL_datasets.find(d => d.id === e.target.value);
                    if (newDs) {
                         const subjIdx = newDs.subjects.indexOf(subjectName);
                         if (subjIdx !== -1) {
                             const newVals = newDs.students.map(s => s.grades[subjIdx]).filter(v => typeof v === 'number' && !isNaN(v));
                             currentValues = newVals;

                // Trend Canvas

                const ctxT = tCanvas.getContext('2d');
                if(histTrendChart) { try { histTrendChart.destroy(); } catch(e){} histTrendChart=null; }
                
                histTrendChart = new Chart(ctxT, {

                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { intersect: false, mode: 'index' } },
                        scales: { y: { display: true, min: 0, max: 10, ticks: { display: false } }, x: { ticks: { display: false } } }, 
                        layout: { padding: 0 }
                    }
                });
            }

            modal.style.display = 'flex';
            // slight delay to allow display flex to apply before adding class (for potential transition if changed)
            requestAnimationFrame(() => {
                modal.classList.add('active');
                document.getElementById('main-content').classList.add('blur');
            });

            const ctx = canvas.getContext('2d');
            if (histChart) { try { histChart.destroy(); } catch(e){} histChart = null; }
            
            // Render function
            function renderBins(binWidth) {
                binWidth = parseFloat(binWidth) || 1;
                const nBins = Math.max(1, Math.ceil(10 / binWidth));
                const bins = new Array(nBins).fill(0);
                for (let v of currentValues) {
                    if (typeof v !== 'number' || isNaN(v)) continue;
                    let idx = Math.floor(v / binWidth);
                    if (idx < 0) idx = 0;
                    if (idx >= nBins) idx = nBins - 1;
                    bins[idx]++;
                }
                const labels = [];
                for (let i = 0; i < nBins; i++) {
                    const lower = (i * binWidth);
                    const upper = Math.min(10, (i + 1) * binWidth);
                        const center = (lower + upper) / 2;
                        const fmt = n => (Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(2));
                        if (Math.abs(binWidth - 1) < 1e-9) {
                            labels.push(String(Math.round(center)));
                        } else {
                            labels.push(`${fmt(lower)}-${fmt(upper)}`);
                        }
                }
                if (!histChart) {
                    histChart = new Chart(ctx, {
                        type: 'bar',
                        data: { labels, datasets: [{ label: 'Conteggio', data: bins, backgroundColor: 'rgba(25,118,210,0.6)' }] },

                             responsive: true,
                             maintainAspectRatio: false,
                            scales: { x: { ticks: { color: '#222' } }, y: { beginAtZero: true, ticks: { color: '#222' } } }
                        }
                    });
                } else {
                    histChart.data.labels = labels;
                    histChart.data.datasets[0].data = bins;
                    histChart.update();
                }
            }

            // initial render
            const initialBin = slider ? parseFloat(slider.value) : 1;
            renderBins(initialBin);
            
            if (slider) {
                slider.oninput = () => {

                 select.appendChild(opt);
             });
             
             // Data Prep
             const subjects = ds.subjects;
             
             // Pre-calculate point overlaps (stacking)
             // Map key: `${subjectIndex}_${gradeValue}` -> count
             const stackCounts = {};
             ds.students.forEach(s => {
                 s.grades.forEach((g, i) => {
                     if(g !== null && !isNaN(g)) {
                         const key = `${i}_${g}`;
                         stackCounts[key] = (stackCounts[key] || 0) + 1;
                     }
                 });
             });

             // Create datasets for all
             // Default: faint opacity
             const datasets = ds.students.map((s, i) => {
                 const ptColors = s.grades.map(g => (g>=6 ? '#1ec01e' : '#d21919'));
                 return {
                     label: s.name,
                     data: s.grades.map(g => isNaN(g) ? null : g),
                     borderColor: 'rgba(25, 118, 210, 0.15)',
                     backgroundColor: 'transparent',
                     pointBackgroundColor: ptColors,
                     // Dynamic point radius based on stack count
                     pointRadius: (ctx) => {
                        const val = ctx.raw;
                        const idx = ctx.dataIndex;
                        if(val === null || isNaN(val)) return 0;
                        const count = stackCounts[`${idx}_${val}`] || 1;
                        // Base 3, add 1.5 per extra person? Max cap 10?
                        const r = 3 + (count - 1) * 1.5;
                        return Math.min(r, 12);
                     },
                     pointHoverRadius: 6,
                     borderWidth: 1,
                     order: 1 // Default order
                 };
             });
             
             // Add Class Average
             datasets.push({

                 borderDash: [5,5],
                 pointRadius: 0,
                 order: 0 // Top
             });

             const ctx = canvas.getContext('2d');
             if(combinedChart) combinedChart.destroy();
             
             // Plugin to show values on Combined Radar (only if highlighted)
             const combinedValPlugin = {
                id: 'combinedValPlugin',
                afterDatasetsDraw(chart) {
                    const ctx = chart.ctx;
                    // Find if any dataset is highlighted (borderWidth 3 or order 0)
                    // We rely on order 0 being the "on top" selected one.
                    chart.data.datasets.forEach(ds => {
                        if (ds.order === 0 && ds.label !== 'Sufficienza') {
                             const meta = chart.getDatasetMeta(chart.data.datasets.indexOf(ds));
                             const rScale = chart.scales.r;
                             const xCenter = rScale.xCenter;
                             const yCenter = rScale.yCenter;
                             
                             meta.data.forEach((element, index) => {
                                 const val = ds.data[index];
                                 if (val !== null && !isNaN(val)) {
                                     const ex = element.x;
                                     const ey = element.y;
                                     const dx = xCenter - ex;
                                     const dy = yCenter - ey;
                                     const dist = Math.sqrt(dx*dx + dy*dy);
                                     
                                     // Offset 15px towards center
                                     const offset = 15;
                                     const u = dx / dist; 
                                     const v = dy / dist;
                                     const tx = ex + u*offset;
                                     const ty = ey + v*offset;
                                     
                                     // Style
                                     ctx.save();
                                     ctx.font = 'bold 11px "Azeret Mono"'; // Smaller font (was 14px)
                                     ctx.textAlign = 'center';
                                     ctx.textBaseline = 'middle';
                                     
                                     // Color match point
                                     const ptColor = Array.isArray(ds.pointBackgroundColor) ? ds.pointBackgroundColor[index] : ds.pointBackgroundColor;
                                     
                                     let displayVal = val;
                                     if(typeof val === 'number' && ds.label === 'Media Classe') {
                                         displayVal = val.toFixed(1);
                                     }

                                     // White Outline
                                     ctx.strokeStyle = '#ffffff';
                                     ctx.lineWidth = 3;
                                     ctx.strokeText(displayVal, tx, ty);
                                      
                                     // Fill
                                     ctx.fillStyle = ptColor || '#000';
                                     ctx.fillText(displayVal, tx, ty);
                                     
                                     ctx.restore();
                                 }
                             });
                        }
                    });
                }
             };

             // Create Chart
             combinedChart = new Chart(ctx, {
                 type: 'radar',
                 data: {
                     labels: subjects,
                     datasets: datasets
                 },
                 options: {
                     responsive: true,
                     maintainAspectRatio: false,
                     scales: {
                         r: {
                             min: 0,
                             max: 10,
                             ticks: {
                                 stepSize: 2,
                                 backdropColor: 'transparent',
                                 font: { family: 'Azeret Mono', size: 10 },
                                 color: '#334155' // Darker text
                             },
                             pointLabels: {
                                 font: { family: 'Azeret Mono', size: 11, weight: '600' },
                                 color: '#1e293b', // Darker labels
                                 padding: 20 // Move labels further out
                             },
                             grid: {
                                 color: (ctx) => (ctx.tick.value === 6 ? '#64748b' : '#cbd5e1'), // Darker limit and grid
                                 lineWidth: (ctx) => (ctx.tick.value === 6 ? 2 : 1)
                             },
                             angleLines: { color: '#cbd5e1' } // Darker angle lines
                         }
                     },
                     plugins: {
                         legend: { display: false },
                         tooltip: {
                             // Technical Theme
                             backgroundColor: '#ffffff',
                             titleColor: '#1e293b',
                             bodyColor: '#334155',
                             borderColor: '#e2e8f0',
                             borderWidth: 1,
                             titleFont: { family: '"Azeret Mono"', size: 12 },
                             bodyFont: { family: '"Azeret Mono"', size: 12 },
                             padding: 10,
                             displayColors: true,
                             boxPadding: 4
                         }
                     }
                 },
                 plugins: [combinedValPlugin] 
             });
             
             // Handle Selection
             select.onchange = () => {
                 const selName = select.value;
                 
                 combinedChart.data.datasets.forEach(d => {
                     // Reset default style
                     if (!d.pointBackgroundColor) return; // Skip lines without points
                     
                     if (selName === "") {
                         // Everyone visible but faint
                         d.borderColor = 'rgba(25, 118, 210, 0.15)';
                         d.borderWidth = 1;
                         d.order = 1;
                         d.pointRadius = 3;
                     } else {
                         if (d.label === selName) {
                             // Highlight
                             d.borderColor = 'rgba(25, 118, 210, 1)';
                             d.borderWidth = 3;
                             d.order = 0; // Bring to front
                             d.pointRadius = 5;
                         } else {
                             // Fade
                             d.borderColor = 'rgba(200, 200, 200, 0.05)';
                             d.borderWidth = 1;
                             d.pointRadius = 2; // shrink dots
                             d.order = 10; // Send back
                         }
                     }
                 });
                 combinedChart.update();
             };
        });

        // Generate a human-readable Italian report and show it in a modal
        function generateReport() {
            const dataset = getActiveDataset();
            if (!dataset) return;
            
            const students = dataset.students || [];
            const subjects = dataset.subjects || [];
            const classAvg = dataset.classAvg || [];
            const overallAvg = dataset.overallAvg;
            const today = new Date().toLocaleDateString('it-IT');

            function mean(arr){ if(!arr || arr.length===0) return NaN; return arr.reduce((a,b)=>a+b,0)/arr.length; }
            function stddev(arr){ if(!arr||arr.length===0) return NaN; const m = mean(arr); return Math.sqrt(arr.reduce((s,x)=>s+(x-m)*(x-m),0)/arr.length); }

            // per-subject stats
            const subjStats = subjects.map((subj, i) => {
                const vals = students.map(s => s.grades[i]).filter(isNumeric);
                const avg = vals.length? mean(vals) : NaN;
                const sd = vals.length? stddev(vals) : NaN;
                const belowCount = vals.filter(v => v < 6).length;
                const deficit = vals.filter(v => v < 6).reduce((a,b)=>a+(6-b),0);
                return { subj, avg, sd, belowCount, deficit };
            });

            // student averages
            const studentAvgs = students.map(s => {
                const vals = s.grades.filter(isNumeric);
                const avg = vals.length? mean(vals) : NaN;
                return { name: s.name, avg };
            });

            const sorted = studentAvgs.slice().filter(s=>!isNaN(s.avg)).sort((a,b)=>b.avg-a.avg);
            const top = sorted.slice(0,3);
            const bottom = sorted.slice(-3).reverse();

            // build multiple report sections (plain-text + html) so each can be copied separately
            const allNumericGrades = students.flatMap(s => s.grades.filter(isNumeric));
            const overallSd = allNumericGrades.length ? stddev(allNumericGrades) : NaN;
            const studentsWithData = students.filter(s => s.grades.some(isNumeric));
            const belowCounts = studentsWithData.map(s => s.grades.filter(v => isNumeric(v) && v < 6).length);
            const meanBelowPerStudent = belowCounts.length ? mean(belowCounts) : NaN;
            const totalInsuff = subjStats.reduce((a,b)=>a+b.belowCount,0);
            const totalDeficit = subjStats.reduce((a,b)=>a+b.deficit,0);
            const avgDeficitPerInsuff = totalInsuff ? (totalDeficit / totalInsuff) : NaN;

            // Section: Overall metrics
            const overallPlain = `Media generale di classe: ${isNaN(overallAvg)?'-':overallAvg.toFixed(2)}\nDeviazione standard generale: ${isNaN(overallSd)?'-':overallSd.toFixed(2)}\nNumero medio di insufficienze (per studente): ${isNaN(meanBelowPerStudent)?'-':meanBelowPerStudent.toFixed(2)}\nScostamento medio dalla sufficienza (per insufficienza): ${isNaN(avgDeficitPerInsuff)?'-':avgDeficitPerInsuff.toFixed(2)}\n`;

            // Section: per-subject means
            let subjPlain = 'Medie per materia:\n';
            subjStats.forEach(s => subjPlain += ` - ${s.subj}: ${isNaN(s.avg)?'-':s.avg.toFixed(2)} (dev.std ${isNaN(s.sd)?'-':s.sd.toFixed(2)})\n`);

            // Section: counts and deficits
            let countsPlain = 'Conteggi voti <6 per materia e deficit totale:\n';
            subjStats.forEach(s => countsPlain += ` - ${s.subj}: <6=${s.belowCount}, deficit=${s.deficit.toFixed(2)}\n`);

            // Section: top/bottom
            const topPlain = `Top: ${top.map(t=>`${t.name} (${t.avg.toFixed(2)})`).join(' / ')}\nBottom: ${bottom.map(t=>`${t.name} (${t.avg.toFixed(2)})`).join(' / ')}\n`;

            // Section: comments
            let commentsPlain = 'Commento automatico:\n';
            subjStats.forEach(s => {
                if (isNaN(s.avg)) commentsPlain += ` - ${s.subj}: dati insufficienti.\n`;
                else if (s.avg < 5.5) commentsPlain += ` - ${s.subj}: media bassa (${s.avg.toFixed(2)}). Suggerito intervento mirato.\n`;
                else if (s.avg < 6.5) commentsPlain += ` - ${s.subj}: media nella fascia di attenzione (${s.avg.toFixed(2)}). Monitorare i progressi.\n`;
                else commentsPlain += ` - ${s.subj}: media soddisfacente (${s.avg.toFixed(2)}).\n`;
            });

            // aggregate plain text (full report)
            const fullPlain = `Report di classe — ${today}\n\n` + overallPlain + '\n' + subjPlain + '\n' + countsPlain + '\n' + topPlain + '\n' + commentsPlain;

            // build html with separate sections and per-section copy buttons
            let html = `<div>`;
            html += `<div class="report-header"><strong>Report di classe — ${today}</strong><div></div></div>`;
            
            const makeSec = (id, title, key, content) => `
                <div id="${id}" class="report-section">
                    <div class="report-header">
                        <strong>${title}</strong>
                        <button class="sec-copy btn btn-ghost" style="padding:2px 8px; font-size:10px;" data-sec="${key}">Copia</button>
                    </div>
                    <pre class="report-pre">${content}</pre>
                </div>`;

            html += makeSec('sec-overall', 'Metriche generali', 'overall', overallPlain);
            html += makeSec('sec-subj', 'Medie per materia', 'subjects', subjPlain);
            html += makeSec('sec-counts', 'Conteggi <6 e deficit', 'counts', countsPlain);
            html += makeSec('sec-top', 'Classifica sintetica', 'top', topPlain);
            html += makeSec('sec-comments', 'Commento automatico', 'comments', commentsPlain);
            html += `</div>`;

            // pass a map of section plain texts to showReport so it can wire per-section copy buttons
            const sectionsMap = { overall: overallPlain, subjects: subjPlain, counts: countsPlain, top: topPlain, comments: commentsPlain };
            showReport(html, fullPlain, sectionsMap);
        }

        function showReport(htmlContent, plainText, sections) {
            const modal = document.getElementById('report-modal');
            const popup = document.getElementById('report-popup');
            const body = document.getElementById('report-body');
            const title = document.getElementById('report-title');
            body.innerHTML = htmlContent;
            modal.classList.add('active');
            document.getElementById('main-content').classList.add('blur');

            // wire copy
            const copyBtn = document.getElementById('copy-report');
            if (copyBtn) {
                copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(plainText);
                        copyBtn.textContent = 'Copiato';
                        setTimeout(()=>copyBtn.textContent = 'Copia report',1200);
                    } catch(e){
                        alert('Copia fallita: ' + (e && e.message));
                    }
                };
            }

            // per-section copy buttons (if sections map provided)
            if (sections && typeof sections === 'object') {
                const secBtns = popup.querySelectorAll('.sec-copy');
                secBtns.forEach(btn => {
                    const key = btn.getAttribute('data-sec');
                    btn.onclick = async () => {
                        const txt = sections[key] || '';
                        try {
                            await navigator.clipboard.writeText(txt);
                            const old = btn.textContent;
                            btn.textContent = 'Copiato';
                            setTimeout(()=> btn.textContent = old, 1000);
                        } catch(e) {
                            alert('Copia fallita: ' + (e && e.message));
                        }
                    };
                });
            }

            // print
            const printBtn = document.getElementById('print-report');
            if (printBtn) {
                printBtn.onclick = () => {
                    const w = window.open('', '_blank');
                    w.document.write(`<html><head><title>Report</title></head><body>${htmlContent}</body></html>`);
                    w.document.close();
                    w.print();
                };
            }

            // close handlers (animated)
            // close handlers (animated)
            document.getElementById('report-close').onclick = () => {
                closeWithAnim(modal, 'report-popup');
            };
            modal.onclick = e => { if (e.target === modal) { closeWithAnim(modal, 'report-popup'); } };
        } // Close generateReport

        // wire generate report button after DOM ready
        document.addEventListener('click', function(ev){
            if (ev.target && ev.target.id === 'generate-report') {
                generateReport();
            }
        });
    </script>
    </body>
